services:
  api:
    build: .
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    # Uncomment to serve the full catalogue instead of the built-in sample.
    # Run `python -m app.build` on the host first.
    # volumes:
    #   - ./data/processed:/app/data/processed
    #   - ./data/artifacts:/app/data/artifacts

  ui:
    build: .
    command: streamlit run frontend/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
